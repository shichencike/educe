name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build-cmd: "cargo zigbuild --release"
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build-cmd: "cargo zigbuild --release"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build-cmd: "cargo build --release --no-default-features --features tls-native"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装 zig（交叉编译 musl 用）
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: 安装 cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --locked --version 0.23.0
      - name: 构建
        run: ${{ matrix.build-cmd }} --target ${{ matrix.target }}
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: educe-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/educe
            target/${{ matrix.target }}/release/educe.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            Educe 元搜索引擎发布版（静态编译单二进制）。

            - linux-x86_64: Linux 静态（musl）
            - linux-aarch64: ARM64 Linux / Termux
            - windows-x86_64: Windows（schannel TLS）
