name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build-cmd: "cargo zigbuild --release"
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build-cmd: "cargo zigbuild --release"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build-cmd: "cargo build --release --no-default-features --features tls-native"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装 zig（交叉编译 musl 用）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # mlugg/setup-zig 依赖的 ziglang.org/builds 路径已 404（文件已迁移到
          # /download/<version>/ 下）、镜像源也 502，改为直接下载官方发布链接；
          # 官方失败时回退社区镜像，并用官方 sha256 校验完整性。
          curl -fL --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz \
            || curl -fL --retry 3 https://pkg.machengine.org/zig/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          # 显式告知 cargo-zigbuild zig 的位置（不依赖 PATH 解析），
          # 并在本步骤内直接验证 zig 可执行，失败会在此立即报错。
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          echo "CARGO_ZIGBUILD_ZIG_PATH=$PWD/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"
          "$PWD/zig-x86_64-linux-0.16.0/zig" version
      - name: 安装 cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --locked --version 0.23.0
      - name: 构建
        run: ${{ matrix.build-cmd }} --target ${{ matrix.target }}
      - name: 重命名产物（平台唯一文件名，避免 Release 上传同名覆盖）
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release/educe" ]; then
            cp "target/${{ matrix.target }}/release/educe" "target/${{ matrix.target }}/release/educe-${{ matrix.name }}"
          fi
          if [ -f "target/${{ matrix.target }}/release/educe.exe" ]; then
            cp "target/${{ matrix.target }}/release/educe.exe" "target/${{ matrix.target }}/release/educe-${{ matrix.name }}.exe"
          fi
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: educe-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/educe-${{ matrix.name }}*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            Educe 元搜索引擎发布版（静态编译单二进制）。

            - linux-x86_64: Linux 静态（musl）
            - linux-aarch64: ARM64 Linux / Termux
            - windows-x86_64: Windows（schannel TLS）
