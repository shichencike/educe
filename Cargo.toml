[package]
name = "educe"
version = "2.2.0"
edition = "2021"
description = "Educe 元搜索引擎：聚合多源搜索结果的 Rust 静态编译服务（Web + REST API）"
license = "MIT"

[[bin]]
name = "educe"
path = "src/main.rs"

[features]
# TLS 后端二选一：
#  - tls-rustls（默认）：rustls + ring，用于 Linux / Termux 静态编译（CI 中有 C 编译器）
#  - tls-native       ：Windows 用系统 schannel（纯 Rust 绑定，零 C 依赖，无需安装任何编译器）
# 本机 Windows 验证：cargo check --no-default-features --features tls-native
# tls-rustls 使用 reqwest 的 no-provider 形态：根证书信任链完全由 src/tls.rs 控制
# （内置 Mozilla 根 webpki-roots + 系统根回退 + 私有 CA 环境变量注入）。
default = ["tls-rustls"]
tls-rustls = [
    "reqwest/rustls-tls-no-provider",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:rustls-native-certs",
]
tls-native = ["reqwest/native-tls"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "io-util", "process"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "gzip",
    "brotli",
    "cookies",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
percent-encoding = "2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
anyhow = "1"
scraper = "0.21"
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"

# ---- TLS 信任链（tls-rustls 后端）----
# rustls：ring 提供者（与 reqwest 原 rustls-tls 行为一致，静态编译友好）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# 内置 Mozilla 根证书（编译期快照）
webpki-roots = { version = "1.0", optional = true }
# 系统根证书：Windows ROOT 证书库 / macOS keychain / Linux & Termux CA bundle
rustls-native-certs = { version = "0.8", optional = true }
# PEM 解析（两个 TLS 后端共用：私有 CA 文件解析）
rustls-pemfile = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

# ---- Termux（Android）本机构建 profile ----
# 手机内存/算力有限：关闭 LTO、提高并行编译单元，显著降低内存占用与构建时间，
# 避免低内存设备 OOM 或构建过慢。用 `cargo build --profile release-termux` 构建
# （scripts/build-termux.sh 与 scripts/termux-setup.sh 已默认使用）。
[profile.release-termux]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = true
panic = "abort"

[profile.release-termux.package."*"]
opt-level = 2
