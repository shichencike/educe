<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educe 元搜索引擎</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2a2f3f;
    --text: #e6e8ee; --muted: #9aa1b3; --accent: #5b8cff; --accent2: #7c5bff;
    --ok: #3ecf8e; --err: #ff6b6b; --warn: #f0b429;
  }
  body.light {
    --bg: #f5f6fa; --panel: #ffffff; --panel2: #f0f2f7; --border: #d9dee9;
    --text: #1c2230; --muted: #5d6679;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
  header h1 {
    font-size: 26px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .tag { color: var(--muted); font-size: 13px; }
  header .settings {
    margin-left: auto; color: var(--muted); font-size: 13px; text-decoration: none;
  }
  header .settings:hover { color: var(--accent); }

  .searchbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .searchbar input {
    flex: 1; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font-size: 15px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar button {
    padding: 0 26px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; font-size: 15px; font-weight: 600;
  }
  .searchbar button:disabled { opacity: .5; cursor: not-allowed; }

  .sources { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .src-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--muted); font-size: 13px; user-select: none;
  }
  .src-chip input { accent-color: var(--accent); }
  .src-chip.on { color: var(--text); border-color: var(--accent); }
  .src-chip .js { font-size: 10px; color: var(--warn); }

  .meta { display: flex; gap: 16px; color: var(--muted); font-size: 13px; margin-bottom: 14px; min-height: 20px; }

  .result {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    transition: border-color .15s;
  }
  .result:hover { border-color: var(--accent); }
  .result .t {
    font-size: 16px; font-weight: 600; margin-bottom: 4px;
  }
  .result .t a { color: var(--accent); text-decoration: none; }
  .result .t a:hover { text-decoration: underline; }
  .result .s { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result .badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
  }
  .badge.rank { color: var(--warn); }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-top: 18px; font-size: 13px;
  }
  .panel h3 { font-size: 14px; margin-bottom: 10px; color: var(--muted); }
  .engine-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px dashed var(--border); color: var(--muted);
  }
  .engine-row:last-child { border-bottom: none; }
  .engine-row .st-ok { color: var(--ok); }
  .engine-row .st-err { color: var(--err); }
  .engine-row .st-warn { color: var(--warn); }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .spin {
    width: 26px; height: 26px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: rot .8s linear infinite; margin: 30px auto;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Educe</h1>
    <span class="tag">多源聚合元搜索 · Web + API</span>
    <a class="settings" href="/settings.html">⚙ 设置</a>
  </header>

  <div class="searchbar">
    <input id="q" type="text" placeholder="输入关键词，回车或点击搜索…" autocomplete="off">
    <button id="btn">搜索</button>
  </div>

  <div class="sources" id="sources"><!-- 引擎复选框由 /api/sources 填充 --></div>
  <div class="meta" id="meta"></div>
  <div id="results"></div>
  <div class="panel" id="statusPanel" style="display:none">
    <h3>各源执行情况</h3>
    <div id="statusList"></div>
  </div>
  <footer>Educe · Rust 静态编译 · 支持代理池 / JS 渲染桥 / 结果去重评分</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let engineList = [];
let userPrefs = { theme: 'dark', open_in_new_tab: true };

// 读取 educe_prefs cookie（percent 编码的 JSON）
function readCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
  if (!m) return null;
  try { return JSON.parse(decodeURIComponent(m[1])); } catch (e) { return null; }
}

// 应用主题偏好
function applyPrefs() {
  userPrefs = readCookie('educe_prefs') || {};
  document.body.classList.toggle('light', (userPrefs.theme || 'dark') === 'light');
}

async function loadSources() {
  try {
    const res = await fetch('/api/sources');
    engineList = await res.json();
    const box = $('sources');
    box.innerHTML = '';
    for (const e of engineList) {
      const label = document.createElement('label');
      label.className = 'src-chip' + (e.enabled ? ' on' : '');
      label.innerHTML = `<input type="checkbox" value="${e.id}" ${e.enabled ? 'checked' : ''} ` +
        `onchange="this.parentElement.classList.toggle('on', this.checked)">${e.name}` +
        (e.needs_js ? ' <span class="js">JS</span>' : '');
      box.appendChild(label);
    }
  } catch (err) {
    console.error(err);
  }
}

function selectedSources() {
  return Array.from(document.querySelectorAll('#sources input:checked'))
    .map(i => i.value).join(',');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function badge(s) {
  return `<span class="badge">${esc(s)}</span>`;
}

function renderStatus(reports, total, ms) {
  const panel = $('statusPanel');
  panel.style.display = reports.length ? '' : 'none';
  $('statusList').innerHTML = reports.map(r => {
    const state = r.error
      ? `<span class="st-err">✗ ${esc(r.error)}</span>`
      : `<span class="st-ok">✓ ${r.count} 条</span>`;
    return `<div class="engine-row"><span>${esc(r.id)} · ${r.time_ms}ms</span>${state}</div>`;
  }).join('');
  $('meta').innerHTML = `<span>共 ${total} 条结果</span><span>耗时 ${ms}ms</span><span>引擎 ${reports.length} 个</span>`;
}

async function doSearch() {
  const q = $('q').value.trim();
  if (!q) { $('results').innerHTML = '<div class="empty">请输入关键词</div>'; return; }
  const src = selectedSources();
  const btn = $('btn');
  btn.disabled = true;
  $('results').innerHTML = '<div class="spin"></div>';
  $('statusPanel').style.display = 'none';
  $('meta').textContent = '';

  try {
    const url = `/api/search?q=${encodeURIComponent(q)}&sources=${encodeURIComponent(src)}`;
    const res = await fetch(url);
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      $('results').innerHTML = `<div class="empty">${esc(j.error || '请求失败')}</div>`;
      return;
    }
    const data = await res.json();
    renderStatus(data.engines, data.total, data.time_ms);
    const box = $('results');
    if (!data.results.length) {
      box.innerHTML = '<div class="empty">没有结果（可能是反爬或网络问题，见下方各源状态）</div>';
      return;
    }
    box.innerHTML = data.results.map((r, i) => {
      const srcBadges = r.source.split(',').map(s => badge(s)).join('');
      const date = r.published ? badge(r.published) : '';
      const tab = userPrefs.open_in_new_tab === false ? '_self' : '_blank';
      return `<div class="result">
        <div class="t"><a href="${esc(r.url)}" target="${tab}" rel="noopener noreferrer">${esc(r.title)}</a></div>
        ${r.snippet ? `<div class="s">${esc(r.snippet)}</div>` : ''}
        <div class="badges">${badge('#' + (i + 1))}${srcBadges}${date}</div>
      </div>`;
    }).join('');
  } catch (err) {
    $('results').innerHTML = `<div class="empty">请求失败: ${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

$('btn').addEventListener('click', doSearch);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

applyPrefs();
loadSources();
// 初次进入自动聚焦
$('q').focus();
</script>
</body>
</html>
