<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#0e1117">
<title>设置 · Educe</title>
<style>
  /* ===== 主题变量（与搜索页保持一致）===== */
  :root {
    --bg: #0e1117; --panel: #161b26; --panel2: #1e2432; --border: #2a3142;
    --text: #e6e9f2; --muted: #98a1b8; --accent: #5b8cff; --accent2: #7c5bff;
    --ok: #3ecf8e; --err: #ff6b6b; --warn: #f0b429;
    --radius: 14px; --shadow: 0 6px 24px rgba(0,0,0,.28);
  }
  body.light {
    --bg: #f4f6fb; --panel: #ffffff; --panel2: #eef1f8; --border: #d8deec;
    --text: #1b2233; --muted: #5c6678;
    --shadow: 0 6px 20px rgba(30,40,80,.08);
  }
  /* ===== 主题色板（body[data-accent] 覆盖强调色）===== */
  body[data-accent="purple"] { --accent: #a78bfa; --accent2: #8b5cf6; }
  body[data-accent="green"]  { --accent: #34d399; --accent2: #10b981; }
  body[data-accent="orange"] { --accent: #fb923c; --accent2: #f97316; }
  body[data-accent="pink"]   { --accent: #f472b6; --accent2: #ec4899; }
  body[data-accent="cyan"]   { --accent: #22d3ee; --accent2: #06b6d4; }
  body[data-accent="red"]    { --accent: #f87171; --accent2: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: calc(var(--vh, 1vh) * 100);
    -webkit-tap-highlight-color: transparent;
    transition: background .25s, color .25s;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 60px; }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; margin-bottom: 16px;
  }
  .topbar h1 { font-size: 22px; font-weight: 800; }
  .topbar h1 a {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .topbar .back {
    color: var(--muted); font-size: 14px; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .topbar .back:hover { color: var(--accent); border-color: var(--accent); }

  .section {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .section h2 { font-size: 15px; color: var(--muted); margin-bottom: 14px; font-weight: 700; }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .row:last-child { border-bottom: none; }
  .row label { font-size: 14px; }
  .row .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .row select, .row input[type=number], .row input[type=text], .row textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 11px; font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  .row select:focus, .row input:focus, .row textarea:focus { border-color: var(--accent); }
  .row input[type=number] { width: 110px; }
  .row input[type=text] { width: 280px; max-width: 55vw; }
  .row textarea { width: 300px; max-width: 55vw; font-family: inherit; resize: vertical; }

  /* ===== 主题色板（可视化点选）===== */
  .palette { display: flex; flex-wrap: wrap; align-items: center; }
  .palette .sw {
    width: 26px; height: 26px; border-radius: 50%; margin: 3px 8px 3px 0;
    cursor: pointer; border: 2px solid transparent; padding: 0; flex-shrink: 0;
    transition: transform .1s, border-color .15s;
  }
  .palette .sw:hover { transform: scale(1.12); }
  .palette .sw.on { border-color: var(--text); transform: scale(1.12); }
  .palette .sw-name { font-size: 12px; color: var(--muted); }

  /* ===== 代理连通性测试 ===== */
  #proxyTestResult { font-size: 13px; margin-left: 6px; }
  #proxyTestResult.t-ok { color: var(--ok); }
  #proxyTestResult.t-err { color: var(--err); }
  #proxyTestResult.t-wait { color: var(--muted); }

  /* ===== 自定义引擎解析预览 ===== */
  .ce-test { display: flex; align-items: center; flex-wrap: wrap; max-width: 55vw; }
  .ce-test input[type=text] { width: 220px; margin-right: 8px; }
  #cePreview { margin-top: 12px; }
  #cePreview .pv-head { font-size: 13px; color: var(--ok); margin-bottom: 8px; }
  #cePreview .pv-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
    margin-bottom: 8px; background: var(--panel2); font-size: 13px;
  }
  #cePreview .pv-item a { color: var(--accent); font-weight: 600; }
  #cePreview .pv-url { font-size: 11px; color: var(--ok); margin: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cePreview .pv-snip { color: var(--muted); font-size: 12px; line-height: 1.6; }
  #cePreview .pv-empty, #cePreview .pv-err { font-size: 13px; color: var(--err); }
  #cePreview .pv-wait { font-size: 13px; color: var(--muted); }

  /* Switch 开关（Chrome 70 兼容：不用 accent-color，appearance:none + 伪元素旋钮）*/
  input[type=checkbox].switch {
    -webkit-appearance: none; appearance: none;
    width: 42px; height: 24px; border: 2px solid var(--border); border-radius: 999px;
    background: var(--panel2); cursor: pointer; position: relative; flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  input[type=checkbox].switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted); transition: left .15s, background .15s;
  }
  input[type=checkbox].switch:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox].switch:checked::after { left: 20px; background: #fff; }
  input[type=checkbox].switch:active { transform: scale(.95); }
  input[type=checkbox].switch:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btns .del {
    background: transparent; color: var(--err); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13px;
    transition: border-color .15s;
  }
  .btns .del:hover { border-color: var(--err); }

  .engine-row {
    display: flex; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border);
    font-size: 14px;
  }
  .engine-row:last-child { border-bottom: none; }
  .engine-row .ename { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .engine-row .ename .cat {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 7px; margin-left: 6px;
  }
  .engine-row .ename .jsb { color: var(--warn); font-size: 11px; margin-left: 5px; }
  .engine-row .ctl { display: flex; align-items: center; margin-left: 10px; }
  .engine-row .ctl > * { margin-right: 8px; }
  .engine-row .ctl > *:last-child { margin-right: 0; }
  .engine-row input[type=checkbox].switch {
    -webkit-appearance: none; appearance: none;
    width: 38px; height: 22px; border: 2px solid var(--border); border-radius: 999px;
    background: var(--panel2); cursor: pointer; position: relative; flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  .engine-row input[type=checkbox].switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); transition: left .15s, background .15s;
  }
  .engine-row input[type=checkbox].switch:checked { background: var(--accent); border-color: var(--accent); }
  .engine-row input[type=checkbox].switch:checked::after { left: 18px; background: #fff; }
  .engine-row input[type=checkbox].switch:active { transform: scale(.95); }
  .engine-row input[type=number] {
    width: 76px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 13px; outline: none;
  }
  .engine-row .lab { font-size: 12px; color: var(--muted); }

  .btns { display: flex; flex-wrap: wrap; margin-top: 4px; }
  .btns > button, .btns > .btn-group { margin-right: 12px; margin-bottom: 8px; }
  .btns > *:last-child { margin-right: 0; }
  .btns button {
    padding: 11px 26px; border: none; border-radius: 999px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: transform .1s, opacity .15s;
  }
  .btns button:active { transform: scale(.96); }
  .btns .save { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
  .btns .reset { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
  .btns .mini {
    background: transparent; color: var(--accent); border: 1px solid var(--border);
    padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 999px;
  }
  .btn-group { display: flex; }
  .btn-group .mini { margin-right: 8px; }
  .btn-group .mini:last-child { margin-right: 0; }
  #msg { margin-top: 14px; font-size: 13px; min-height: 20px; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); }
  #msgCustom { margin-top: 10px; font-size: 13px; min-height: 20px; }
  #msgCustom.ok { color: var(--ok); }
  #msgCustom.err { color: var(--err); }
  #msgConfig { margin-top: 10px; font-size: 13px; min-height: 20px; }
  #msgConfig.ok { color: var(--ok); }
  #msgConfig.err { color: var(--err); }

  /* ===== 响应式（移动端）===== */
  @media (max-width: 640px) {
    .wrap { padding: 0 12px 50px; }
    .topbar { padding: 12px 0; }
    .section { padding: 15px 14px; }
    .row { flex-wrap: wrap; }
    .row label { width: 100%; margin-bottom: 6px; }
    .row select, .row input[type=number], .row input[type=text], .row textarea { width: 100%; max-width: none; }
    .engine-row { flex-wrap: wrap; }
    .engine-row .ename { width: 100%; margin-bottom: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1><a href="/">Educe</a> 设置</h1>
    <a class="back" href="/">← 返回搜索</a>
  </div>

  <div class="section">
    <h2>常规</h2>
    <div class="row">
      <label>界面语言
        <span class="hint">页面与提示语言</span>
      </label>
      <select id="lang">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="row">
      <label>主题
        <span class="hint">auto = 跟随系统（不支持时回退深色）</span>
      </label>
      <select id="theme">
        <option value="dark">深色</option>
        <option value="light">浅色</option>
        <option value="auto">跟随系统</option>
      </select>
    </div>
    <div class="row">
      <label>主题色
        <span class="hint">界面强调色（按钮 / 链接 / 开关 / 高亮）</span>
      </label>
      <div class="palette" id="palette"><!-- 色板由 JS 填充 --></div>
    </div>
    <div class="row">
      <label>每页结果数
        <span class="hint">未指定 max 时的默认结果数量</span>
      </label>
      <select id="rpp">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="500">500</option>
      </select>
    </div>
    <div class="row">
      <label>新标签页打开结果
        <span class="hint">点击结果时是否新开浏览器标签</span>
      </label>
      <input type="checkbox" id="newtab" class="switch">
    </div>
    <div class="row">
      <label>单源超时（毫秒）
        <span class="hint">0 = 使用配置文件超时</span>
      </label>
      <input type="number" id="timeout" min="0" step="500">
    </div>
  </div>

  <div class="section">
    <h2>搜索引擎</h2>
    <div class="btns" style="margin-bottom:10px">
      <div class="btn-group">
        <button class="mini" onclick="setAllEngines(true)">全选</button>
        <button class="mini" onclick="setAllEngines(false)">全不选</button>
      </div>
    </div>
    <div id="engines"><!-- 引擎行由 /api/prefs 填充 --></div>
  </div>

  <div class="section">
    <h2>代理池（全局）</h2>
    <div class="row">
      <label>启用代理池
        <span class="hint">所有引擎请求经代理转发；支持 http / https / socks5</span>
      </label>
      <input type="checkbox" id="proxyEnabled" class="switch">
    </div>
    <div class="row">
      <label>代理地址（每行一个）
        <span class="hint">如 http://127.0.0.1:7890 或 socks5://127.0.0.1:1080</span>
      </label>
      <textarea id="proxyUrls" rows="3" placeholder="http://127.0.0.1:7890"></textarea>
    </div>
    <div class="row">
      <label>轮换策略
        <span class="hint">多代理时按轮询或随机选取</span>
      </label>
      <select id="proxyRotate">
        <option value="round_robin">轮询 round_robin</option>
        <option value="random">随机 random</option>
      </select>
    </div>
    <div class="row">
      <label>连通性测试
        <span class="hint">用当前填写（未保存）的配置实测代理是否可用，不影响现有连接</span>
      </label>
      <button class="mini" id="proxyTestBtn" onclick="testProxy()">测试连接</button>
      <span id="proxyTestResult"></span>
    </div>
  </div>

  <div class="section">
    <h2>JS 渲染桥（全局）</h2>
    <div class="row">
      <label>启用 JS 渲染桥
        <span class="hint">让外部命令（Node+puppeteer 等）渲染页面后回传 HTML 解析，用于知乎/CSDN/Google 等源</span>
      </label>
      <input type="checkbox" id="jsEnabled" class="switch">
    </div>
    <div class="row">
      <label>渲染命令
        <span class="hint">接收一个 URL 参数，渲染后的 HTML 输出到 stdout</span>
      </label>
      <input type="text" id="jsCommand" placeholder="node js-exec/render.js">
    </div>
    <div class="row">
      <label>渲染超时（毫秒）
        <span class="hint">单页渲染最大等待时间</span>
      </label>
      <input type="number" id="jsTimeout" min="1000" step="1000">
    </div>
    <div class="row">
      <label>使用 JS 桥的源
        <span class="hint">逗号分隔引擎 id，如 zhihu,csdn,google</span>
      </label>
      <input type="text" id="jsSources" placeholder="zhihu,csdn,jianshu,wechat,google">
    </div>
  </div>

  <div class="section">
    <h2>自定义搜索引擎</h2>
    <div id="customList"><!-- 由 /api/engines/custom 填充 --></div>
    <h2 style="margin-top:16px">添加 / 更新自定义引擎</h2>
    <div class="row">
      <label>ID
        <span class="hint">2~32 位字母/数字/下划线，如 myblog；与内置引擎不冲突</span>
      </label>
      <input type="text" id="ceId" placeholder="myblog">
    </div>
    <div class="row">
      <label>名称
        <span class="hint">显示名，如 我的博客</span>
      </label>
      <input type="text" id="ceName" placeholder="我的博客">
    </div>
    <div class="row">
      <label>分类</label>
      <select id="ceCategory">
        <option value="general">通用</option>
        <option value="code">代码</option>
        <option value="chinese">中文</option>
        <option value="academic">学术</option>
      </select>
    </div>
    <div class="row">
      <label>需要 JS 渲染
        <span class="hint">该源页面需执行 JS 时勾选（需启用上方 JS 渲染桥）</span>
      </label>
      <input type="checkbox" id="ceJs" class="switch">
    </div>
    <div class="row">
      <label>URL 模板
        <span class="hint">必须含 {query} 占位符，会被 URL 编码后替换</span>
      </label>
      <input type="text" id="ceUrl" placeholder="https://example.com/search?q={query}">
    </div>
    <div class="row">
      <label>结果容器选择器
        <span class="hint">每条结果的外层元素，CSS 选择器</span>
      </label>
      <input type="text" id="ceResult" placeholder=".item">
    </div>
    <div class="row">
      <label>标题选择器
        <span class="hint">相对结果容器的标题元素</span>
      </label>
      <input type="text" id="ceTitle" placeholder="h3 a">
    </div>
    <div class="row">
      <label>链接选择器
        <span class="hint">相对结果容器的链接元素（取 href）</span>
      </label>
      <input type="text" id="ceLink" placeholder="h3 a">
    </div>
    <div class="row">
      <label>摘要选择器（可空）
        <span class="hint">相对结果容器的摘要元素</span>
      </label>
      <input type="text" id="ceSnippet" placeholder="p.desc">
    </div>
    <div class="row">
      <label>解析测试
        <span class="hint">输入测试关键词，实时预览该配置解析出的结果（不保存）</span>
      </label>
      <div class="ce-test">
        <input type="text" id="ceTestQuery" placeholder="测试关键词，如 rust 异步">
        <button class="mini" id="ceTestBtn" onclick="testCustom()">测试解析</button>
      </div>
    </div>
    <div id="cePreview"><!-- 解析结果预览 --></div>
    <div class="btns">
      <button class="save" onclick="addCustom()">添加 / 更新</button>
    </div>
    <div id="msgCustom"></div>
  </div>

  <div class="section">
    <h2>配置备份（导入 / 导出）</h2>
    <div class="row">
      <label>导出当前配置
        <span class="hint">下载当前生效的完整配置（静态 config + 运行时 + 自定义引擎）为 JSON 文件</span>
      </label>
      <button class="mini" id="exportBtn" onclick="exportConfig()">导出配置</button>
    </div>
    <div class="row">
      <label>导入配置
        <span class="hint">选择之前导出的 JSON 文件；运行时设置立即生效，静态配置写入 config.toml（重启后完全生效）</span>
      </label>
      <input type="file" id="configFile" accept=".json,application/json" style="max-width:55vw">
    </div>
    <div id="msgConfig"></div>
  </div>

  <div class="btns">
    <button class="save" onclick="save()">保存</button>
    <button class="reset" onclick="reset()">恢复默认</button>
    <button class="save" onclick="saveRuntime()" style="margin-left:auto">保存代理池 + JS 桥</button>
  </div>
  <div id="msg"></div>
</div>

<script>
// ===== 工具 =====
const $ = (id) => document.getElementById(id);
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function msg(t, isErr) { const m = $('msg'); m.textContent = t; m.className = isErr ? 'err' : 'ok'; }

// ===== 主题预览（与搜索页一致：auto 跟随系统）=====
function systemPrefersLight() {
  try {
    if (!window.matchMedia) return false;
    return window.matchMedia('(prefers-color-scheme: light)').matches;
  } catch (e) { return false; }
}
function applyThemePreview() {
  const pref = prefs.theme || 'dark';
  let light = pref === 'light';
  if (pref === 'auto') light = systemPrefersLight();
  document.body.classList.toggle('light', light);
  document.body.dataset.accent = prefs.accent || 'blue';
  const tc = document.getElementById('themeColor');
  if (tc) tc.content = light ? '#f4f6fb' : '#0e1117';
}

// ===== 主题色板（可视化点选）=====
const ACCENTS = [
  { name: 'blue',   c1: '#5b8cff', c2: '#7c5bff', label: '蓝' },
  { name: 'purple', c1: '#a78bfa', c2: '#8b5cf6', label: '紫' },
  { name: 'green',  c1: '#34d399', c2: '#10b981', label: '绿' },
  { name: 'orange', c1: '#fb923c', c2: '#f97316', label: '橙' },
  { name: 'pink',   c1: '#f472b6', c2: '#ec4899', label: '粉' },
  { name: 'cyan',   c1: '#22d3ee', c2: '#06b6d4', label: '青' },
  { name: 'red',    c1: '#f87171', c2: '#ef4444', label: '红' },
];

function renderPalette() {
  const box = $('palette');
  box.innerHTML = '';
  const cur = prefs.accent || 'blue';
  for (let i = 0; i < ACCENTS.length; i++) {
    const a = ACCENTS[i];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sw' + (a.name === cur ? ' on' : '');
    btn.title = a.label;
    btn.style.background = 'linear-gradient(135deg,' + a.c1 + ',' + a.c2 + ')';
    btn.dataset.accent = a.name;
    btn.addEventListener('click', function () {
      prefs.accent = a.name;
      document.body.dataset.accent = a.name;
      renderPalette(); // 刷新选中态（保存时随 save() 提交）
    });
    box.appendChild(btn);
  }
}

let prefs = { lang: 'zh', theme: 'dark', accent: 'blue', results_per_page: 50, open_in_new_tab: true, timeout_ms: 0, engines: {} };

async function load() {
  try {
    const r = await fetch('/api/prefs');
    prefs = await r.json();
    $('lang').value = prefs.lang || 'zh';
    $('theme').value = prefs.theme || 'dark';
    $('rpp').value = String(prefs.results_per_page || 50);
    $('newtab').checked = prefs.open_in_new_tab !== false;
    $('timeout').value = prefs.timeout_ms || 0;
    renderPalette();
    renderEngines();
    applyThemePreview();
  } catch (e) {
    msg('加载偏好失败: ' + e.message, true);
  }
}
function renderEngines() {
  const box = $('engines');
  box.innerHTML = '';
  const catName = { general: '通用', code: '代码', chinese: '中文', academic: '学术' };
  const ids = Object.keys(prefs.engines || {});
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    const p = prefs.engines[id];
    const row = document.createElement('div');
    row.className = 'engine-row';
    row.innerHTML =
      '<div class="ename">' + esc(id) +
      '<span class="cat">' + (catName[metaCat[id]] || '源') + '</span>' +
      (metaJs[id] ? '<span class="jsb">需JS</span>' : '') + '</div>' +
      '<div class="ctl">' +
      '<input type="checkbox" class="switch" data-enable="' + esc(id) + '"' + (p.enabled ? ' checked' : '') + '>' +
      '<span class="lab">启用</span>' +
      '</div>' +
      '<div class="ctl">' +
      '<input type="number" step="0.1" min="0" placeholder="权重" data-weight="' + esc(id) + '"' +
      ' value="' + (p.weight != null ? p.weight : '') + '">' +
      '<span class="lab">权重</span>' +
      '</div>';
    box.appendChild(row);
  }
}

// 全选 / 全不选所有引擎（仅修改勾选状态，需点击保存生效）
function setAllEngines(on) {
  const ids = Object.keys(prefs.engines || {});
  for (let i = 0; i < ids.length; i++) {
    const en = document.querySelector('[data-enable="' + ids[i] + '"]');
    if (en) en.checked = on;
  }
}

function save() {
  const engines = {};
  const ids = Object.keys(prefs.engines || {});
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    const en = document.querySelector('[data-enable="' + id + '"]');
    if (!en) continue;
    const w = document.querySelector('[data-weight="' + id + '"]');
    const wv = w && w.value !== '' ? parseFloat(w.value) : null;
    engines[id] = { enabled: en.checked, weight: (wv != null && isFinite(wv) && wv >= 0) ? wv : null };
  }
  const body = {
    lang: $('lang').value,
    theme: $('theme').value,
    accent: prefs.accent || 'blue',
    results_per_page: parseInt($('rpp').value, 10) || 50,
    open_in_new_tab: $('newtab').checked,
    timeout_ms: parseInt($('timeout').value, 10) || 0,
    engines
  };
  fetch('/api/prefs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    msg('已保存，偏好将在此浏览器生效');
  }).catch(e => msg('保存失败: ' + e.message, true));
}

function reset() {
  if (!confirm('恢复默认偏好？当前自定义设置将被清除。')) return;
  fetch('/api/prefs', { method: 'DELETE' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); location.reload(); })
    .catch(e => msg('恢复失败: ' + e.message, true));
}

// 引擎分类/JS 标记（从 /api/sources 拉取，或回退为空）
let metaCat = {}, metaJs = {};
fetch('/api/sources').then(r => r.json()).then(list => {
  for (const e of list) { metaCat[e.id] = e.category; metaJs[e.id] = e.needs_js; }
  renderEngines();
}).catch(() => {});

// ---- 运行时设置（代理池 / JS 桥）----
let runtime = null;

async function loadRuntime() {
  try {
    runtime = await (await fetch('/api/runtime')).json();
    $('proxyEnabled').checked = !!runtime.proxy_enabled;
    $('proxyUrls').value = (runtime.proxy_urls || []).join('\n');
    $('proxyRotate').value = runtime.proxy_rotate || 'round_robin';
    $('jsEnabled').checked = !!runtime.js_enabled;
    $('jsCommand').value = runtime.js_command || '';
    $('jsTimeout').value = runtime.js_timeout_ms || 30000;
    $('jsSources').value = (runtime.js_sources || []).join(',');
  } catch (e) {
    msg('加载运行时设置失败: ' + e.message, true);
  }
}

function saveRuntime() {
  if (!runtime) return msg('运行时设置尚未加载，请刷新页面', true);
  runtime.proxy_enabled = $('proxyEnabled').checked;
  runtime.proxy_urls = $('proxyUrls').value.split('\n').map(s => s.trim()).filter(Boolean);
  runtime.proxy_rotate = $('proxyRotate').value;
  runtime.js_enabled = $('jsEnabled').checked;
  runtime.js_command = $('jsCommand').value.trim();
  runtime.js_timeout_ms = parseInt($('jsTimeout').value, 10) || 30000;
  runtime.js_sources = $('jsSources').value.split(',').map(s => s.trim()).filter(Boolean);
  fetch('/api/runtime', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(runtime)
  }).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(new Error(j.error || 'HTTP ' + r.status))))
    .then(d => { runtime = d; msg('代理池与 JS 桥设置已保存并立即生效'); })
    .catch(e => msg('保存失败: ' + e.message, true));
}

// 代理连通性测试：用表单中当前（未保存）的配置请求后端实测
async function testProxy() {
  const btn = $('proxyTestBtn');
  const res = $('proxyTestResult');
  const body = {
    enabled: $('proxyEnabled').checked,
    urls: $('proxyUrls').value.split('\n').map(s => s.trim()).filter(Boolean),
    rotate: $('proxyRotate').value
  };
  btn.disabled = true;
  res.textContent = '测试中…';
  res.className = 't-wait';
  try {
    const r = await fetch('/api/runtime/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.ok) {
      res.textContent = '✓ 连通正常（' + d.time_ms + 'ms）';
      res.className = 't-ok';
    } else {
      res.textContent = '✗ ' + (d.error || '连接失败') + '（' + d.time_ms + 'ms）';
      res.className = 't-err';
    }
  } catch (e) {
    res.textContent = '✗ 请求失败: ' + e.message;
    res.className = 't-err';
  } finally {
    btn.disabled = false;
  }
}

// ---- 自定义引擎 ----
let customEngines = [];

async function loadCustom() {
  try {
    customEngines = await (await fetch('/api/engines/custom')).json();
    renderCustom();
  } catch (e) { /* 忽略 */ }
}

function renderCustom() {
  const box = $('customList');
  if (!customEngines.length) {
    box.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:6px 0">暂无自定义引擎，可在下方添加</div>';
    return;
  }
  box.innerHTML = customEngines.map(c =>
    '<div class="engine-row">' +
    '<div class="ename">' + esc(c.name) + ' <span class="cat">' + esc(c.id) + '</span>' +
    (c.needs_js ? '<span class="jsb">需JS</span>' : '') + '</div>' +
    '<div class="ctl" style="min-width:0;overflow:hidden;text-overflow:ellipsis">' +
    '<span class="lab">' + esc(c.url_template) + '</span></div>' +
    '<div class="ctl"><button class="del" onclick="delCustom(\'' + esc(c.id) + '\')">删除</button></div>' +
    '</div>').join('');
}

function addCustom() {
  const body = {
    id: $('ceId').value.trim(),
    name: $('ceName').value.trim(),
    category: $('ceCategory').value,
    needs_js: $('ceJs').checked,
    url_template: $('ceUrl').value.trim(),
    result_selector: $('ceResult').value.trim(),
    title_selector: $('ceTitle').value.trim(),
    link_selector: $('ceLink').value.trim(),
    snippet_selector: $('ceSnippet').value.trim(),
  };
  fetch('/api/engines/custom', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(new Error(j.error || 'HTTP ' + r.status))))
    .then(list => {
      customEngines = list;
      renderCustom();
      const m = $('msgCustom');
      m.textContent = '已保存：' + body.id + '（回到搜索页即可使用）';
      m.className = 'ok';
    })
    .catch(e => {
      const m = $('msgCustom');
      m.textContent = '添加失败: ' + e.message;
      m.className = 'err';
    });
}

function delCustom(id) {
  if (!confirm('删除自定义引擎 ' + id + '？')) return;
  fetch('/api/engines/custom/' + encodeURIComponent(id), { method: 'DELETE' })
    .then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(new Error(j.error || 'HTTP ' + r.status))))
    .then(list => { customEngines = list; renderCustom(); })
    .catch(e => {
      const m = $('msgCustom');
      m.textContent = '删除失败: ' + e.message;
      m.className = 'err';
    });
}

// 自定义引擎解析测试：用表单中当前配置 + 测试关键词请求后端预览
async function testCustom() {
  const box = $('cePreview');
  const btn = $('ceTestBtn');
  const query = $('ceTestQuery').value.trim();
  if (!query) {
    box.innerHTML = '<div class="pv-err">请输入测试关键词</div>';
    return;
  }
  const config = {
    id: $('ceId').value.trim(),
    name: $('ceName').value.trim(),
    category: $('ceCategory').value,
    needs_js: $('ceJs').checked,
    url_template: $('ceUrl').value.trim(),
    result_selector: $('ceResult').value.trim(),
    title_selector: $('ceTitle').value.trim(),
    link_selector: $('ceLink').value.trim(),
    snippet_selector: $('ceSnippet').value.trim(),
  };
  btn.disabled = true;
  box.innerHTML = '<div class="pv-wait">解析中…</div>';
  try {
    const r = await fetch('/api/engines/custom/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config: config, query: query, max: 5 })
    });
    const d = await r.json();
    if (!d.ok) {
      box.innerHTML = '<div class="pv-err">' + esc(d.error || '测试失败') + '</div>';
      return;
    }
    if (!d.results || !d.results.length) {
      box.innerHTML = '<div class="pv-err">解析成功但无结果（检查选择器是否匹配页面结构）</div>';
      return;
    }
    let html = '<div class="pv-head">✓ 解析出 ' + d.count + ' 条（' + d.time_ms + 'ms）</div>';
    for (let i = 0; i < d.results.length; i++) {
      const it = d.results[i];
      html += '<div class="pv-item">' +
        '<div><a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></div>' +
        '<div class="pv-url">' + esc(it.url) + '</div>' +
        (it.snippet ? '<div class="pv-snip">' + esc(it.snippet) + '</div>' : '') +
        '</div>';
    }
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="pv-err">请求失败: ' + esc(e.message) + '</div>';
  } finally {
    btn.disabled = false;
  }
}

// ===== 配置导入 / 导出 =====
// 导出当前生效配置为 JSON 文件下载
async function exportConfig() {
  const m = $('msgConfig');
  try {
    const r = await fetch('/api/config/export');
    const d = await r.json();
    const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'educe-config-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    m.textContent = '已导出当前配置';
    m.className = 'ok';
  } catch (e) {
    m.textContent = '导出失败: ' + e.message;
    m.className = 'err';
  }
}

// 导入配置：读取选中的 JSON 文件并 POST 到 /api/config/import
async function importConfig() {
  const m = $('msgConfig');
  const file = $('configFile').files && $('configFile').files[0];
  if (!file) { m.textContent = ''; return; }
  try {
    const text = await file.text();
    let data;
    try { data = JSON.parse(text); } catch (e) {
      m.textContent = '文件不是有效 JSON: ' + e.message;
      m.className = 'err';
      return;
    }
    m.textContent = '导入中…';
    m.className = '';
    const r = await fetch('/api/config/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    m.textContent = d.message || '导入成功';
    m.className = 'ok';
    // 立即生效的部分（运行时 / 自定义引擎）刷新展示
    loadRuntime();
    loadCustom();
    $('configFile').value = '';
  } catch (e) {
    m.textContent = '导入失败: ' + e.message;
    m.className = 'err';
  }
}

load();
loadRuntime();
loadCustom();

// 文件选择后自动导入
$('configFile').addEventListener('change', importConfig);

</script>
